# Configuración de pantalla horizontal
# Muestra hora, fecha, día de la semana y valores de sensores

esphome:
  name: esp32-rellotge
  friendly_name: Rellotge Temperatura ESP32
  on_boot:
    then:
      - output.set_level:
          id: backlight_pwm
          level: 0.70
esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Hardware related setup
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 5000 Hz
    inverted: true

globals:
  - id: agenda_rotation_idx
    type: int
    restore_value: no
    initial_value: "0"

interval:
  - interval: 8s
    then:
      - lambda: |-
          id(agenda_rotation_idx)++;

display:
  - platform: ili9xxx
    model: ili9342
    color_palette: 8BIT
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    invert_colors: false
    rotation: 180
    update_interval: 1s
    lambda: |-
      // Fons negre
      it.fill(id(negre));

      // Rellotge digital gran centrat (blanc)
      auto now = id(my_time).now();
      it.printf(it.get_width() / 2, 34, id(font_digital_gran), id(blanc), TextAlign::CENTER, "%02d:%02d:%02d", now.hour, now.minute, now.second);

      // Dia i mes (mes en lletres) más pequeño
      const char* mesos[12] = {"gener", "febrer", "març", "abril", "maig", "juny", "juliol", "agost", "setembre", "octubre", "novembre", "desembre"};
      const char* dies[7] = {"diumenge", "dilluns", "dimarts", "dimecres", "dijous", "divendres", "dissabte"};
      char data_mes[32];
      snprintf(data_mes, sizeof(data_mes), "%02d %s", now.day_of_month, mesos[now.month - 1]);
      it.printf(it.get_width() / 2, 84, id(font_digital_petit), id(blanc), TextAlign::CENTER, "%s", data_mes);
      // Día de la semana y año juntos, centrados, en gris
      char dia_any[32];
      snprintf(dia_any, sizeof(dia_any), "%s %04d", dies[(now.day_of_week - 1) % 7], now.year);
      it.printf(it.get_width() / 2, 109, id(font_digital_petit), id(gris), TextAlign::CENTER, "%s", dia_any);

      // Agenda de calendari: avui i els pròxims set dies
      auto is_valid_text = [&](const std::string &value) {
        return !value.empty() && value != "unknown" && value != "unavailable" && value != "None";
      };

      std::string notices[5];
      int notice_colors[5];
      int notice_order[5];
      int notice_count = 0;

      auto days_from_civil = [](int y, int m, int d) {
        y -= m <= 2;
        const int era = (y >= 0 ? y : y - 399) / 400;
        const unsigned yoe = static_cast<unsigned>(y - era * 400);
        const unsigned doy = static_cast<unsigned>((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1);
        const unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
        return era * 146097 + static_cast<int>(doe);
      };

      const int today_day = days_from_civil(now.year, now.month, now.day_of_month);

      auto add_calendar_notice = [&](const char *source, const std::string &message, const std::string &start_raw, const std::string &end_raw, const std::string &all_day_raw) {
        if (!is_valid_text(message) || !is_valid_text(start_raw) || notice_count >= 5) return;

        int y = 0, m = 0, d = 0, h = 0, mi = 0;
        bool has_time = false;
        bool parsed = false;

        if (sscanf(start_raw.c_str(), "%d-%d-%d %d:%d", &y, &m, &d, &h, &mi) == 5 ||
            sscanf(start_raw.c_str(), "%d-%d-%dT%d:%d", &y, &m, &d, &h, &mi) == 5) {
          parsed = true;
          has_time = true;
        } else if (sscanf(start_raw.c_str(), "%d-%d-%d", &y, &m, &d) == 3) {
          parsed = true;
        }

        if (!parsed) return;
        if (all_day_raw == "true" || all_day_raw == "True" || all_day_raw == "on") has_time = false;

        int ey = 0, em = 0, ed = 0, eh = 0, emi = 0;
        bool end_has_time = false;
        bool end_parsed = false;
        if (sscanf(end_raw.c_str(), "%d-%d-%d %d:%d", &ey, &em, &ed, &eh, &emi) == 5 ||
            sscanf(end_raw.c_str(), "%d-%d-%dT%d:%d", &ey, &em, &ed, &eh, &emi) == 5) {
          end_parsed = true;
          end_has_time = true;
        } else if (sscanf(end_raw.c_str(), "%d-%d-%d", &ey, &em, &ed) == 3) {
          end_parsed = true;
        }

        int day_delta = days_from_civil(y, m, d) - today_day;
        if (day_delta > 7) return;
        bool ongoing = false;
        if (day_delta < 0) {
          if (!end_parsed) return;
          int end_delta = days_from_civil(ey, em, ed) - today_day;
          if (all_day_raw == "true" || all_day_raw == "True" || all_day_raw == "on") {
            if (end_has_time && eh == 0 && emi == 0) end_delta -= 1;
          }
          if (end_delta < 0) return;
          ongoing = true;
          day_delta = 0;
        }

        char when[32];
        int color_id = 0;
        if (day_delta == 0) {
          color_id = 1;
          if (ongoing) {
            if (has_time)
              snprintf(when, sizeof(when), "AVUI FINS %02d:%02d", eh, emi);
            else
              snprintf(when, sizeof(when), "AVUI TOT EL DIA");
            color_id = 2;
          } else if (has_time) {
            int delta_min = (h * 60 + mi) - (now.hour * 60 + now.minute);
            if (delta_min >= 0 && delta_min <= 60) {
              snprintf(when, sizeof(when), "D'AQUÍ %dm", delta_min);
              color_id = 2;
            } else if (delta_min < 0) {
              snprintf(when, sizeof(when), "ARA");
              color_id = 2;
            } else {
              snprintf(when, sizeof(when), "AVUI %02d:%02d", h, mi);
            }
          } else {
            snprintf(when, sizeof(when), "AVUI TOT EL DIA");
          }
        } else if (day_delta == 1) {
          if (has_time)
            snprintf(when, sizeof(when), "DEMÀ %02d:%02d", h, mi);
          else
            snprintf(when, sizeof(when), "DEMÀ TOT EL DIA");
        } else {
          if (has_time)
            snprintf(when, sizeof(when), "PROP %02d/%02d %02d:%02d", d, m, h, mi);
          else
            snprintf(when, sizeof(when), "PROP %02d/%02d", d, m);
        }

        std::string line = std::string(when);
        if (std::string(source) == "ANIV") line += " ANIV";
        line += ": " + message;
        if (line.size() > 76) line = line.substr(0, 76);
        notices[notice_count] = line;
        notice_colors[notice_count] = color_id;
        notice_order[notice_count] = day_delta * 1440 + (has_time ? h * 60 + mi : 0);
        notice_count++;
      };

      add_calendar_notice("CITA", id(calendar_joan_message).state, id(calendar_joan_start_time).state, id(calendar_joan_end_time).state, id(calendar_joan_all_day).state);
      add_calendar_notice("ANIV", id(calendar_birthdays_message).state, id(calendar_birthdays_start_time).state, id(calendar_birthdays_end_time).state, id(calendar_birthdays_all_day).state);

      for (int i = 0; i < notice_count - 1; i++) {
        for (int j = i + 1; j < notice_count; j++) {
          if (notice_order[j] < notice_order[i]) {
            std::swap(notices[i], notices[j]);
            std::swap(notice_colors[i], notice_colors[j]);
            std::swap(notice_order[i], notice_order[j]);
          }
        }
      }

      it.printf(it.get_width() / 2, 188, id(font_agenda_small), id(gris), TextAlign::TOP_CENTER, "AGENDA");
      if (notice_count == 0) {
        it.printf(it.get_width() / 2, 212, id(font_agenda), id(gris), TextAlign::CENTER, "SENSE ESDEVENIMENTS");
        it.printf(it.get_width() / 2, 228, id(font_agenda), id(gris), TextAlign::CENTER, "AVUI");
      } else {
        int idx = id(agenda_rotation_idx) % notice_count;
        Color notice_color = id(gris);
        if (notice_colors[idx] == 1) {
          notice_color = id(taronja);
        } else if (notice_colors[idx] == 2) {
          notice_color = id(vermell);
        }
        std::string line1 = notices[idx];
        std::string line2 = "";
        if (line1.size() > 28) {
          size_t split = line1.rfind(' ', 28);
          if (split == std::string::npos || split < 18) {
            split = 28;
          }
          line2 = line1.substr(split + 1);
          line1 = line1.substr(0, split);
          if (line2.size() > 28) {
            line2 = line2.substr(0, 28);
          }
        }
        auto render_agenda_line = [&](int y, const std::string &line) {
          size_t aniv_pos = line.find("ANIV:");
          if (aniv_pos == std::string::npos) {
            it.printf(it.get_width() / 2, y, id(font_agenda), notice_color, TextAlign::CENTER, "%s", line.c_str());
            return;
          }
          std::string prefix = line.substr(0, aniv_pos);
          std::string suffix = line.substr(aniv_pos + 5);
          int x1, y1, w_prefix, h_prefix;
          int x2, y2, w_icon, h_icon;
          int x3, y3, w_suffix, h_suffix;
          it.get_text_bounds(0, 0, prefix.c_str(), id(font_agenda), TextAlign::TOP_LEFT, &x1, &y1, &w_prefix, &h_prefix);
          it.get_text_bounds(0, 0, "\U000F00EB", id(font_agenda_icon), TextAlign::TOP_LEFT, &x2, &y2, &w_icon, &h_icon);
          it.get_text_bounds(0, 0, suffix.c_str(), id(font_agenda), TextAlign::TOP_LEFT, &x3, &y3, &w_suffix, &h_suffix);
          int spacing = 2;
          int total_width = w_prefix + spacing + w_icon + w_suffix;
          int start_x = (it.get_width() - total_width) / 2;
          it.printf(start_x, y, id(font_agenda), notice_color, TextAlign::CENTER_LEFT, "%s", prefix.c_str());
          it.printf(start_x + w_prefix + spacing, y, id(font_agenda_icon), id(taronja), TextAlign::CENTER_LEFT, "\U000F00EB");
          it.printf(start_x + w_prefix + spacing + w_icon, y, id(font_agenda), notice_color, TextAlign::CENTER_LEFT, "%s", suffix.c_str());
        };
        render_agenda_line(212, line1);
        render_agenda_line(228, line2);
        it.printf(it.get_width() - 8, it.get_height() - 2, id(font_agenda_small), id(gris), TextAlign::BOTTOM_RIGHT, "%d/%d", idx + 1, notice_count);
      }

      // Zona inferior: sensores con iconos BMP
      int x_esq = 60;
      int y_temp = 158;
      int y_hum = 181;
      // Icono izquierda (casa)
      it.image(x_esq-12, y_temp-38, id(icono_interior));
      char temp_esq[16];
      snprintf(temp_esq, sizeof(temp_esq), "%.1fC", id(despatx_wifi_temperature_humidity_sensor_temperatura).state);
      it.printf(x_esq, y_temp, id(font_sensor_temp), id(blanc), TextAlign::CENTER, "%s", temp_esq);
      char hum_esq[8];
      snprintf(hum_esq, sizeof(hum_esq), "%.0f%%", id(despatx_wifi_temperature_humidity_sensor_humitat).state);
      it.printf(x_esq, y_hum, id(font_sensor_hum), id(gris), TextAlign::CENTER, "%s", hum_esq);
      // Icono derecha (meteorología)
      int x_dret = it.get_width() - 60;
      std::string cond = id(metno_condition).state;
      if (cond == "sunny") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_sunny));
      } else if (cond == "partlycloudy") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_partlycloudy));
      } else if (cond == "cloudy") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_cloudy));
      } else if (cond == "rainy") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_rainy));
      } else if (cond == "pouring") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_pouring));
      } else if (cond == "lightning") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_lightning));
      } else if (cond == "lightning-rainy") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_lightning_rainy));
      } else if (cond == "snowy") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_snowy));
      } else if (cond == "snowy-rainy") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_snowy_rainy));
      } else if (cond == "windy") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_windy));
      } else if (cond == "fog") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_fog));
      } else if (cond == "hail") {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_hail));
      } else {
        it.image(x_dret-12, y_temp-38, id(icono_exterior_cloudy)); // icono por defecto
      }
      // Valores de temperatura y humedad exterior
      char temp_dret[16];
      snprintf(temp_dret, sizeof(temp_dret), "%.1fC", id(estacion_oregon_temperatura).state);
      it.printf(x_dret, y_temp, id(font_sensor_temp), id(blanc), TextAlign::CENTER, "%s", temp_dret);
      char hum_dret[8];
      snprintf(hum_dret, sizeof(hum_dret), "%.0f%%", id(estacion_oregon_humedad).state);
      it.printf(x_dret, y_hum, id(font_sensor_hum), id(gris), TextAlign::CENTER, "%s", hum_dret);


# Reloj de tiempo real
time:
  - platform: sntp
    id: my_time
    timezone: Europe/Madrid

# Sensores externos de Home Assistant
sensor:
  - platform: homeassistant
    id: despatx_wifi_temperature_humidity_sensor_temperatura
    entity_id: sensor.despatx_wifi_temperature_humidity_sensor_temperatura
    filters:
      - throttle: 60s
  - platform: homeassistant
    id: despatx_wifi_temperature_humidity_sensor_humitat
    entity_id: sensor.despatx_wifi_temperature_humidity_sensor_humitat
    filters:
      - throttle: 60s
  - platform: homeassistant
    id: estacion_oregon_temperatura
    entity_id: sensor.bth01_9e69_temperature
    filters:
      - throttle: 60s
  - platform: homeassistant
    id: estacion_oregon_humedad
    entity_id: sensor.bth01_9e69_humidity
    filters:
      - throttle: 60s

